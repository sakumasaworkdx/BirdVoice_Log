<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BirdVoice_Log</title>
</head>
<body>

<div id="app">
  <h1>BirdVoice_Log <span>v5.2 (rollback+fix)</span></h1>

  <div>
    <label>検出感度: <span id="thVal">40</span>dB</label><br>
    <input type="range" id="threshold" min="0" max="80" value="40">
  </div>

  <div>
    <label>解析時間上限（秒）</label><br>
    <input type="number" id="maxSeconds" min="1" max="30" value="10">
  </div>

  <br>
  <button id="prepareBtn">読み込み/準備</button>
  <button id="scanBtn">スキャン</button>
  <button id="exportAllBtn">全件ZIP保存</button>

  <ul id="list"></ul>
</div>

<script src="script.js"></script>
</body>
</html>
